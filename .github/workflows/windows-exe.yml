name: Build Windows EXE

on:
  push:
    branches: [main, portfolio-shots]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install, test, and build executable
        shell: pwsh
        run: .\build\windows-build.ps1

      - name: Collect clean window screenshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          Copy-Item "dist\p2c-pos-macro-ui-preview.png" "screenshots\clean.png" -Force
          if (!(Test-Path "screenshots\clean.png")) { throw "screenshots\clean.png was not created" }

      - name: Upload clean window screenshot
        uses: actions/upload-artifact@v4
        with:
          name: clean-shot
          path: screenshots/clean.png
          if-no-files-found: error

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: P2CPOSMacro-Windows
          path: |
            dist/P2CPOSMacro.exe
            dist/P2CPOSMacro.exe.sha256.txt
            dist/p2c-pos-macro-ui-preview.png
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/P2CPOSMacro.exe
            dist/P2CPOSMacro.exe.sha256.txt
            dist/p2c-pos-macro-ui-preview.png
          generate_release_notes: true
